; Fase 1 del dron reforestador — ESP32 + PCA9685.   pio run -d firmware/esp32_fase1
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
build_flags =
    -DRC_SBUS           ; quita esta línea si tu emisora no es SBUS (entonces solo FAILSAFE)
    -std=gnu++17
